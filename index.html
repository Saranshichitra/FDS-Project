<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Explore K Nearest Neighbours with a live graph. Move a point and see the closest examples vote." />
    <meta property="og:title" content="KNN visualization" />
    <meta property="og:description" content="Move a point and watch its closest examples vote." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./styles.css" />
    <title>KNN visualization</title>
  </head>
  <body>
    <main class="visualizer-page">
      <header class="visualizer-header">
        <div>
          <h1>KNN visualization</h1>
          <p>Move the diamond, then play the steps to see how it gets an answer.</p>
        </div>
        <button class="reset-button" id="reset-button" type="button">
          <span class="reset-icon" aria-hidden="true">↻</span> Reset
        </button>
      </header>

      <div class="playground">
        <section class="plot-panel" aria-label="KNN graph">
          <div class="plot-toolbar">
            <label for="dataset-select">Examples</label>
            <select id="dataset-select" aria-label="Examples">
              <option>Two groups</option>
              <option>Overlapping groups</option>
              <option>Three groups</option>
            </select>
          </div>

          <div class="plot-wrap">
            <svg
              class="scatter"
              id="scatter"
              viewBox="0 0 720 440"
              role="application"
              aria-label="Interactive KNN graph. Click or drag to move the white diamond. Use arrow keys to move it and plus or minus to change k."
              tabindex="0"
            ></svg>
            <div class="plot-badge" id="plot-badge" aria-live="polite"></div>
          </div>

          <div class="knn-walkthrough">
            <p id="explanation" aria-live="polite"></p>
            <button class="walk-button" id="play-button" type="button">
              Play the steps <span aria-hidden="true">▶</span>
            </button>
          </div>

          <div class="legend" id="legend"></div>
        </section>

        <aside class="controls-panel" aria-label="KNN controls">
          <section class="control-block">
            <div class="control-label">
              <label for="k-range">How many examples vote?</label>
              <output class="k-value" id="k-value" for="k-range">5</output>
            </div>
            <input class="k-slider" id="k-range" type="range" min="1" max="15" value="5" />
            <div class="slider-ticks" id="slider-ticks">
              <button type="button" data-k="1">1</button>
              <button type="button" data-k="3">3</button>
              <button type="button" data-k="5" class="tick-active">5</button>
              <button type="button" data-k="7">7</button>
              <button type="button" data-k="9">9</button>
              <button type="button" data-k="11">11</button>
              <button type="button" data-k="13">13</button>
              <button type="button" data-k="15">15</button>
            </div>
            <p class="help-text">k is the number of examples used in the vote.</p>
          </section>

          <section class="control-block">
            <span class="control-title">Distance</span>
            <div class="segmented-control" role="group" aria-label="Distance method">
              <button type="button" data-metric="euclidean" class="selected" aria-pressed="true">Straight line</button>
              <button type="button" data-metric="manhattan" aria-pressed="false">Grid steps</button>
            </div>
            <p class="help-text">Grid steps add the sideways and up distance.</p>
          </section>

          <button class="toggle-row toggle-on" id="slow-motion-toggle" type="button" role="switch" aria-checked="true">
            <span><strong>Slow motion</strong><small id="speed-description">Steps play slowly</small></span>
            <span class="switch" aria-hidden="true"><i></i></span>
          </button>

          <button class="toggle-row" id="regions-toggle" type="button" role="switch" aria-checked="false">
            <span><strong>Color the winning regions</strong><small>See which group wins across the graph</small></span>
            <span class="switch" aria-hidden="true"><i></i></span>
          </button>

          <section class="results" aria-live="polite">
            <div class="results-heading">
              <h2>Closest examples</h2>
              <span>Distance</span>
            </div>
            <div class="neighbour-list" id="neighbour-list"></div>
            <div class="vote-wrap" id="vote-wrap"></div>
          </section>
        </aside>
      </div>
      <p class="sr-only" id="result-live" aria-live="polite"></p>
    </main>

    <script src="./knn.js"></script>
    <script src="./main.js" defer></script>
  </body>
</html>
